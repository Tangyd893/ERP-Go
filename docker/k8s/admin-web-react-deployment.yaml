apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-web-react
  labels:
    app: admin-web-react
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-web-react
  template:
    metadata:
      labels:
        app: admin-web-react
    spec:
      containers:
        - name: admin-web-react
          image: erp-admin-web-react:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: admin-web-react
spec:
  selector:
    app: admin-web-react
  ports:
    - port: 80
      targetPort: 80
      name: http
